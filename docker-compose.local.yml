volumes:
  mangementlogistics_local_postgres_data: {}
  mangementlogistics_local_postgres_data_backups: {}
  mangementlogistics_local_redis_data: {}
  mangementlogistics_local_grafana_data: {}
  mangementlogistics_local_prometheus_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: mangementlogistics_local_django
    container_name: mangementlogistics_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: mangementlogistics_production_postgres
    container_name: mangementlogistics_local_postgres
    volumes:
      - mangementlogistics_local_postgres_data:/var/lib/postgresql/data
      - mangementlogistics_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: mangementlogistics_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:8.8
    container_name: mangementlogistics_local_redis
    volumes:
      - mangementlogistics_local_redis_data:/data

  celeryworker:
    <<: *django
    image: mangementlogistics_local_celeryworker
    container_name: mangementlogistics_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: mangementlogistics_local_celerybeat
    container_name: mangementlogistics_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  prometheus:
    image: prom/prometheus:latest
    container_name: mangementlogistics_local_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./compose/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - mangementlogistics_local_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - django

  grafana:
    image: grafana/grafana:latest
    container_name: mangementlogistics_local_grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - mangementlogistics_local_grafana_data:/var/lib/grafana
      - ./compose/local/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
